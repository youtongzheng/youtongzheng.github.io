<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Keep backup slides: a talk ending in Thanks with no slide for an audience question, versus main slides followed by backup slides that answer it</title>
<rect width="680" height="210" fill="#ffffff"/>
<text x="170" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#A32D2D">Bad</text>
<text x="510" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F6E56">Good</text>
<!-- Bad -->
<rect x="20" y="30" width="300" height="169" rx="4" fill="none" stroke="#888780"/>
<g fill="none" stroke="#888780">
<rect x="34" y="120" width="44" height="32" rx="2"/><rect x="88" y="120" width="44" height="32" rx="2"/><rect x="142" y="120" width="44" height="32" rx="2"/><rect x="196" y="120" width="44" height="32" rx="2"/></g>
<g fill="#5F5E5A" font-size="10" text-anchor="middle"><text x="56" y="140">1</text><text x="110" y="140">2</text><text x="164" y="140">3</text><text x="218" y="140">4</text></g>
<rect x="250" y="120" width="56" height="32" rx="2" fill="#EEEDEA" stroke="#888780"/><text x="278" y="140" font-size="10" fill="#5F5E5A" text-anchor="middle">Thanks</text>
<rect x="120" y="44" width="150" height="34" rx="8" fill="#F4F3F0" stroke="#888780"/><path d="M180 78 L172 92 L194 78" fill="#F4F3F0" stroke="#888780"/><rect x="181" y="76" width="12" height="3" fill="#F4F3F0"/>
<text x="195" y="66" font-size="13" fill="#2C2C2A" text-anchor="middle">"What about winter?"</text>
<text x="170" y="192" font-size="13" fill="#A32D2D" text-anchor="middle">No slide to show</text>
<!-- Good -->
<rect x="360" y="30" width="300" height="169" rx="4" fill="none" stroke="#888780"/>
<g fill="none" stroke="#888780">
<rect x="370" y="120" width="34" height="32" rx="2"/><rect x="408" y="120" width="34" height="32" rx="2"/><rect x="446" y="120" width="34" height="32" rx="2"/></g>
<g fill="#5F5E5A" font-size="10" text-anchor="middle"><text x="387" y="140">1</text><text x="425" y="140">2</text><text x="463" y="140">3</text></g>
<rect x="484" y="120" width="38" height="32" rx="2" fill="none" stroke="#0F6E56" stroke-width="1.5"/><text x="503" y="140" font-size="9" fill="#0F6E56" text-anchor="middle">Key</text>
<path d="M530 116 L530 158" stroke="#888780" stroke-dasharray="3 3"/><text x="530" y="110" font-size="10" fill="#5F5E5A" text-anchor="middle">Backup</text>
<g fill="none" stroke="#888780"><rect x="538" y="120" width="34" height="32" rx="2"/><rect x="576" y="120" width="34" height="32" rx="2" stroke="#0F6E56" stroke-width="2"/><rect x="614" y="120" width="34" height="32" rx="2"/></g>
<g fill="#5F5E5A" font-size="10" text-anchor="middle"><text x="555" y="140">B1</text><text x="593" y="140" fill="#0F6E56" font-weight="bold">B2</text><text x="631" y="140">B3</text></g>
<rect x="470" y="44" width="150" height="34" rx="8" fill="#F4F3F0" stroke="#888780"/>
<text x="545" y="66" font-size="13" fill="#2C2C2A" text-anchor="middle">"What about winter?"</text>
<path d="M580 80 L592 114" stroke="#0F6E56" stroke-width="2" fill="none"/><path d="M586 108 L593 117 L595 106" fill="none" stroke="#0F6E56" stroke-width="2"/>
<text x="510" y="192" font-size="13" fill="#0F6E56" text-anchor="middle">→ B2, ready</text>
</svg>
