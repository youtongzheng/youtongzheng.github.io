# Home page
intro: >-
  We study **clouds, convection, and precipitation**, and their roles in weather and climate.
  The WEAVE Lab combines observations, high-resolution simulations, theory, and machine learning,
  because the atmosphere is understood best when different kinds of evidence are woven together.
  Much of our current work is on the thunderstorms of the Texas Gulf Coast and on whether
  the models we use to predict them get the right answer for the right physical reason.

join_us: >-
  We are looking for **self-motivated PhD students and postdocs** who enjoy physics, data, and
  building tools. If you are interested, email Youtong with your CV and a few sentences on
  what you would like to work on.
