  text: "\"Idealized large-eddy simulations of stratocumulus advecting over cold water. Part I: Boundary layer decoupling\" is published in the *Journal of the Atmospheric Sciences*. [Article](https://doi.org/10.1175/JAS-D-21-0108.1)"
