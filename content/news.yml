  text: Youtong received the University of Houston Presidential Circle Award for national recognition during 2023–2024.
- date: 2025-03
  text: Raymond Oware was awarded a Lawrence Livermore National Laboratory Atmospheric, Earth & Energy Graduate Student Summer Internship.
- date: 2024-12
  text: "Three presentations at AGU 2024: Youtong on GCM simulations of tropical anvil clouds ([abstract](https://agu.confex.com/agu/agu24/meetingapp.cgi/Paper/1677246)), Raymond Oware on SCREAM simulations of deep convection during TRACER ([abstract](https://agu.confex.com/agu/agu24/meetingapp.cgi/Paper/1618855)), and Mampi Sarkar on the microphysical control of shallow rain evaporation ([abstract](https://agu.confex.com/agu/agu24/meetingapp.cgi/Paper/1710603))."
- date: 2024-08
  text: "Youtong gave an Early Career plenary talk at the [2024 DOE EESM PI Meeting](https://eesm.science.energy.gov/2024-eesm-pi-meeting-agenda-and-presentations)."
- date: 2023-11
  text: "Youtong spoke at the [UH STEM Zone Saturday Program](https://uh.edu/stem/events/stem-zone/), an outreach event for students from 23 counties."
- date: 2023-09
  text: "Youtong received a $875,000 Early Career Award from the U.S. Department of Energy. [News](https://uh.edu/nsm/news-events/stories/2023/1116-early-career-award.php)"
- date: 2023-01
  text: "Youtong joined the University of Houston as an Assistant Professor, and presented on cloudiness in the GFDL atmosphere model at the AMS Annual Meeting. [Session](https://ams.confex.com/ams/103ANNUAL/meetingapp.cgi/Session/62459)"
- date: 2022-12
  text: "\"Low-level cloud budgets across sea ice edges,\" with Yi Ming, is published in the *Journal of Climate*. [Article](https://doi.org/10.1175/JCLI-D-22-0301.1)"
- date: 2022-01
  text: "Two talks at the AMS Annual Meeting, on shallow cloud transitions and cloud-top radiative cooling. [Talk 1](https://ams.confex.com/ams/102ANNUAL/meetingapp.cgi/Paper/393012) · [Talk 2](https://ams.confex.com/ams/102ANNUAL/meetingapp.cgi/Paper/393145)"
