  text: Raymond Oware received the UH College of Natural Sciences and Mathematics Alumni Association (Eckhard Pfeifer/Carolyn Farb) Scholarship for 2026–2027.
- date: 2026-07
  text: "Ashish Bhattarai's paper on uncertainty-aware machine learning for the onset of deep convection is out in *Geophysical Research Letters*. [Article](https://doi.org/10.1029/2026GL123315)"
- date: 2026-05
  text: "Raymond Oware received the department's Outstanding Graduate Work in Atmospheric Science Award. [Post](https://www.linkedin.com/feed/update/urn:li:activity:7459651947663441922/)"
- date: 2026-04
  text: Youtong presented the group's simulations of Texas Gulf Coast storms at the Workshop on High and Ultra-high Resolution Modeling of the Earth System at Texas A&M University.
- date: 2026-02
  text: "Raymond Oware won the Outstanding Student Presentation Award at the Fifth Symposium on Community Modeling and Innovation, AMS 2026 Annual Meeting. [Post](https://www.linkedin.com/feed/update/urn:li:activity:7431723796417531904/) · [EAS Newsletter](https://newsletter.eas.uh.edu/issues/fall-2025-spring-2026/spotlight/poster-competition)"
- date: 2026-01
  text: "Ronin Costello was selected as a DOE Office of Science Graduate Student Research (SCGSR) Fellow and is spending two semesters at Lawrence Livermore National Laboratory studying Arctic clouds. [NSM News](https://www.uh.edu/nsm/news-events/stories/2026/0202-doe-award.php)"
- date: 2026-01
  text: "The group gave eight presentations at the AMS Annual Meeting, from coastal storms to marine shallow clouds. [Post](https://www.linkedin.com/posts/youtong-zheng-509a878a_ams2026-houston-convection-share-7420230728195575808-CVfG)"
- date: 2025-11
  text: Malinda Millangoda won second place in the Student Poster Presentation Award at the 27th Annual Robert E. Sheriff Lecture.
- date: 2025-10
  text: "\"Physics or knob-tuning? Tropical anvil peak is captured by GCMs,\" with colleagues at Princeton and GFDL, is published in *Geophysical Research Letters*. [Article](https://doi.org/10.1029/2025GL118740)"
- date: 2025-06
  text: Ashish Bhattarai received the UH College of Natural Sciences and Mathematics Alumni Association (Eckhard Pfeifer/Carolyn Farb) Scholarship for 2025–2026.
