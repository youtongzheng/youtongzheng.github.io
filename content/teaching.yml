# Teaching page. Course numbers follow the official numbers in Portfolio/Teaching.md.
# Add a new term by appending to a course's "terms" list.

approach: >-
  Youtong teaches meteorology as a chain of **concept, tool, and decision**: understand the physics,
  learn the tool that measures or predicts it, then use both to make a forecast or a decision. Lectures
  are built around questions. Students answer live polls during class (Top Hat, Mentimeter), work through
  short forecasting exercises with real weather maps, and get practice quizzes and short videos to review.

new_courses: >-
  Since 2024 Youtong has developed three new courses for UH's B.S. in Atmospheric Science:
  **Cloud Physics**, **Synoptic Meteorology** (with lab), and **Mesoscale Meteorology and Forecasting**.
  Synoptic Meteorology is a core course of the new major and is designed to meet the federal GS-1340
  meteorologist requirement used by the National Weather Service and the American Meteorological
  Society's guidelines for a bachelor's degree in atmospheric science.

courses:
  - code: GEOL 1347
    title: Introduction to Meteorology
    level: Undergraduate, all majors
    description: >-
      High- and low-pressure systems, air masses, clouds, the jet stream, precipitation, air–sea
      interactions, local and global circulations, and how to read a weather map. Up to 424 students
      in a section.
    terms: [Fall 2023, Spring 2025, Fall 2026]
  - code: GEOL 4349/6397
    title: Cloud Physics
    level: Undergraduate and graduate
    new: true
    description: >-
      How clouds form, how droplets and ice grow into rain and snow, and how clouds shape weather and
      climate.
    terms: [Spring 2024, Spring 2025]
  - code: GEOL 4352/6397
    title: Synoptic Meteorology (with lab)
    level: Undergraduate and graduate
    new: true
    description: >-
      The atmospheric processes behind winds, temperature change, and precipitation; how mid-latitude
      storms and fronts develop and decay, and their hazards. Weekly labs with real weather maps.
    terms: [Fall 2024, Fall 2025, Fall 2026]
  - code: GEOL 6364/4333
    title: Mesoscale Meteorology and Forecasting
    level: Undergraduate and graduate
    new: true
    description: >-
      Weather systems smaller than a cyclone but larger than a turbulent eddy: thunderstorms, squall
      lines, sea breezes, and the forecasting of each.
    terms: [Spring 2026]
  - code: GEOL 6396
    title: Atmospheric Science Graduate Student Seminar
    level: Graduate
    description: Graduate students present and discuss current research in atmospheric science.
    terms: [Spring 2025]

earlier: >-
  Teaching assistant, AOSC 625 Remote Sensing of Atmospheric Properties by Satellite, University of
  Maryland (2016).

