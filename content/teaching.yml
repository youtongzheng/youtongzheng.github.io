# Images live in static/images/teaching/.

intro: >-
  Students understand the atmosphere when they reason their way to it, and the most valuable skill a
  scientist can have is the judgment to tell whether a result deserves trust. Those two ideas shape how
  Youtong teaches and mentors.

approach:
  - title: One question at a time
    text: >-
      Each lecture is a chain of questions. Each slide answers one and raises the next, and at every
      turning point the question goes to the class. In Synoptic Meteorology, students build vertical
      motion link by link, from the wind field to the ageostrophic wind to divergence, and then use the
      chain on a 300-hPa map to work out why the weather is fair ahead of a ridge and wet ahead of a
      trough. By the time the equation appears, students want it.
  - title: Concept, tool, decision
    text: >-
      Meteorology is taught as a chain: understand the physics, learn the tool that measures or predicts
      it, then use both to make a forecast or a decision. In large classes, live polls (Top Hat,
      Mentimeter), short forecasting exercises, practice quizzes, and short videos keep everyone thinking.
  - title: Learning from students
    text: >-
      When a student wrote that math first and physics later made it "hard to connect the dots," every
      equation was rebuilt to arrive as the answer to a physical question. Reanalysis case studies of
      cyclones, map-based group exercises, and frequent low-stakes practice followed.

courses:
  - code: GEOL 1347
    title: Introduction to Meteorology (with labs)
    level: General education, all majors
    image: images/teaching/intro-meteorology.jpg
    image_alt: Jim Parsons, University of Houston alumnus
    description: >-
      High- and low-pressure systems, air masses, clouds, the jet stream, precipitation, air–sea
      interactions, local and global circulations, and how to read a weather map. One of the largest
      classes at UH, with up to 424 students in a section.
    quote: "I was very fascinated with meteorology at a young age. I lived on the Gulf Coast and hurricanes blew through there. That is the class I failed in college: meteorology."
    quote_by: Jim Parsons, University of Houston alumnus
    terms: [Fall 2023 (207), Spring 2025 (424), Fall 2026 (186)]
  - code: GEOL 4349/6397
    title: Cloud Physics
    level: Undergraduate and graduate
    new: true
    image: images/teaching/cloud-physics.jpg
    image_alt: Satellite view of shallow cumulus clouds over the ocean
    description: >-
      How clouds form, how droplets and ice grow into rain and snow, and how clouds shape weather and
      climate, from the cloud droplet to the cloud field.
    terms: [Spring 2024 (8), Spring 2025 (16)]
  - code: GEOL 4352/6397
    title: Synoptic Meteorology (with lab)
    level: Undergraduate and graduate · core course of the B.S. in Atmospheric Science
    new: true
    image: images/teaching/synoptic.jpg
    image_alt: Schematic of a mid-latitude cyclone with warm and cold fronts
    description: >-
      The processes behind winds, temperature change, and precipitation; how mid-latitude cyclones and
      fronts develop and decay, and their hazards. Built from scratch for UH's new B.S. in Atmospheric
      Science, and designed to meet the federal GS-1340 meteorologist requirement and the AMS guidelines
      for a bachelor's degree in atmospheric science.
    terms: [Fall 2024 (24), Fall 2025 (10), Fall 2026 (18)]
  - code: GEOL 6364/4333
    title: Mesoscale Meteorology and Forecasting
    level: Graduate and undergraduate
    new: true
    image: images/teaching/mesoscale.jpg
    image_alt: Satellite image of a mesoscale convective system over Texas
    description: >-
      Weather systems smaller than a cyclone but larger than a turbulent eddy, where extreme weather
      happens: thunderstorms, squall lines, sea breezes, and mesoscale convective systems, and how to
      forecast them.
    terms: [Spring 2026 (37)]
  - code: GEOL 6396
    title: Atmospheric Science Graduate Student Seminar
    level: Graduate
    description: Graduate students present and discuss current research in atmospheric science.
    terms: [Spring 2025 (9)]

earlier: Teaching Assistant, AOSC 625 Remote Sensing of Atmospheric Properties by Satellite, University of Maryland, 2016.

