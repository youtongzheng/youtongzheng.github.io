mentoring:
  intro: >-
    Two principles guide mentoring in the group. Students grow by **owning a real question**, with more
    guidance at the start and less as they learn to diagnose their own results. And students should be
    **trained for the field they will enter**: since 2026, a weekly AI Agent Day teaches everyone to use
    AI agents in research, and to check every AI result against something the AI did not make, such as
    observations, a reference simulation, a budget that must close, or a number worked out by hand.
