# People page. Photos live in static/images/group/.
# To add a member: copy a block under "members". To move someone to alumni: delete the block and add a line under "alumni".

pi:
  name: Youtong Zheng
  role: Principal Investigator
  photo: images/avatar.jpg
  bio: >-
    Youtong Zheng is an Assistant Professor in the Department of Earth and Atmospheric Sciences at the
    University of Houston (since 2023). Before that, Youtong was an Associate Research Scholar at Princeton
    University and NOAA's Geophysical Fluid Dynamics Laboratory (2021–2023), and a postdoc and Assistant
    Research Scientist at the University of Maryland (2018–2021). Youtong received a Ph.D. from the
    University of Maryland in 2018, advised by Zhanqing Li, and a B.S. from Nanjing
    University of Information Science and Technology. Honors include a DOE Early Career Award (2023) and
    the University of Houston Presidential Circle Award (2025). Youtong is an Associate Editor of the
    *Journal of Climate*.

