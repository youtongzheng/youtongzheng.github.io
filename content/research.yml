# Research themes shown on the Research page (and as cards on the home page).
# papers: publication IDs from publications.yml shown under each theme.

themes:
  - id: coastal
    title: Coastal storms and kilometer-scale models
    short: Why Houston's thunderstorms form where they do, and whether air pollution makes them stronger.
    text: >-
      Sea-breeze thunderstorms bring much of the Texas Gulf Coast's rain and flooding. We study how they
      start, move inland, and respond to the city and its air pollution. A main tool is the U.S. Department
      of Energy's storm-resolving model (E3SM/SCREAM), which we test against observations from the
      DOE TRACER field campaign in Houston, radar, and satellites. This work is funded by a
      [DOE Early Career Award](https://www.uh.edu/nsm/news-events/stories/2023/1116-early-career-award.php).
    papers: [P42, P44]
  - id: lowclouds
    title: Shallow clouds, aerosols, and climate
    short: How low clouds over oceans and the Arctic form, break up, and respond to warming and aerosols.
    text: >-
      Low clouds cool the planet, and how they change with warming is one of the largest uncertainties in
      climate projections. We use large-eddy simulations, global models, and field and satellite
      observations to study how stratocumulus decks break up into cumulus, how rain evaporates below
      clouds, how aerosols change cloud water, and how Arctic clouds respond to sea-ice loss.
    papers: [P43, P46, P41, P34, P32, P29, P24, P21, P16, P08]
  - id: ml
    title: Machine learning that reasons physically
    short: Models, including AI, should get the right answer for the right physical reason.
    text: >-
      We build machine-learning models that say how much they can be trusted and that can be read in
      physical terms: when a model predicts that a storm will start, we want to know when that prediction
      is reliable and why. The group also tests AI agents for research, such as agents that run and check
      climate-model analyses, with the rule that numbers come from trusted, verified code.
    papers: [P49, P41, P38]
  - id: updrafts
    title: Cloud-base updrafts from satellites
    short: Retrieving the vertical air motion that feeds clouds, from space.
    text: >-
      The updrafts at cloud base control how many droplets a cloud forms. Youtong's PhD and postdoctoral
      work developed theory and satellite methods to estimate these updrafts and cloud-top radiative
      cooling, and used them to show how aerosols change ocean clouds.
    papers: [P20, P15, P10, P09, P05, P04, P03, P02]

funding:
  - "U.S. Department of Energy, Office of Science, Early Career Research Program: *Using Kilometer-Scale E3SM to Investigate Air Pollution Impacts on Coastal Storms* (PI, 2023–2028)."
  - "DOE Office of Science Graduate Student Research (SCGSR) award to Ronin Costello at Lawrence Livermore National Laboratory (2025–2026)."

collaborators: >-
  Lawrence Livermore National Laboratory, Pacific Northwest National Laboratory, Argonne National
  Laboratory, NOAA Geophysical Fluid Dynamics Laboratory, Princeton University, University of Maryland,
  and the Hebrew University of Jerusalem.

tools: >-
  Models: E3SM/SCREAM, WRF, CESM, GFDL AM4/CM4, System for Atmospheric Modeling (SAM).
  Data: DOE ARM and TRACER, NEXRAD/MRMS radar, GOES and other satellites, reanalysis.
  Methods: large-eddy simulation, process diagnostics, explainable and uncertainty-aware machine learning.
