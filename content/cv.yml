# CV page. Wording and order follow Y. Zheng's CV (Michigan CLaSP 2026 version); facts from Portfolio/.
# Each section has a title, an id (used in links), and items of {when, what}.
# "what" accepts **bold**, *italic*, [link](url). Publications, teaching, and mentoring have their own pages.

interests: >-
  Kilometer-scale modeling of clouds, convection, precipitation, and extreme weather, combining field and
  satellite observations, theory, models across scales, and AI into one line of evidence on whether models
  get extreme weather right for the right physical reasons.

